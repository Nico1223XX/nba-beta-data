name: NBA backup collector (gap data via artifacts only)
# Runs every 5 min (GitHub minimum). FIRST checks whether the local VM is
# alive (beta_latest.json freshness, 10-min threshold, aligned with the
# liveness alarm). If the board is fresh, exits WITHOUT collecting. Only
# when the board is stale does it collect one snapshot of the 4 legs
# (ESPN/Kalshi/Polymarket/ProphetX) and upload it as a GitHub Actions
# artifact (retention 1 day). Collected DATA never enters git history.
#
# RISK CONTROLS (Nico, 2026-11-19):
# - ZERO git writes: this workflow never commits or pushes anything.
#   The only durable output is the artifact. The local merge job
#   discovers artifacts through the GitHub API (needs the PAT).
# - Kill switch: backup_config.json "enabled": false disables
#   collection instantly (the collector exits before any fetch).
# - Conservative threshold: stale_minutes 10 in backup_config.json.
# - NO DKNet leg in v1 (Playwright on the runner is unverified):
#   odds + company line only. DKNet is a v2 candidate.
# - AN is skipped (blocked from runner IPs); ESPN covers the company line.
# - workflow_dispatch "force_collect" is test-only: it forces one
#   collection run regardless of freshness. Cron runs never force.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_collect:
        description: 'Force one collection run (test only; ignores freshness)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: nba-backup-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect gap snapshot (or skip if board is fresh)
        id: collect
        env:
          BACKUP_FORCE_COLLECT: ${{ inputs.force_collect }}
        run: |
          # collector exits 0 on leg failures (verdict is in the summary);
          # a non-zero exit means a real crash and fails this step loudly.
          python3 tools/nba_backup_collect.py --config backup_config.json --repo-dir . --out gap_snapshot.json
          DECISION=$(python3 -c "import json; print(json.load(open('collect_summary.json')).get('decision','error'))")
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
      - name: Upload gap artifact (1-day retention, auto-deletes)
        id: upload
        if: steps.collect.outputs.decision == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: gap-${{ github.run_id }}
          path: gap_snapshot.json
          retention-days: 1
