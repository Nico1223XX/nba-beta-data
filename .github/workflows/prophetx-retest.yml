name: ProphetX retest (temporary, delete after)
on:
  push:
    paths:
      - '.github/workflows/prophetx-retest.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run ProphetX retest (no writes)
        run: |
          set +e
          python3 tools/prophetx-retest/prophetx_retest.py > prophetx_retest_result.txt 2>&1
          echo "exit=$?" >> prophetx_retest_result.txt
      - name: Commit result back
        if: always()
        run: |
          git config user.name "muse-test"
          git config user.email "muse-test@local"
          git add prophetx_retest_result.txt
          git commit -m "ProphetX retest result (temporary)" || echo "nothing to commit"
          git push
      - name: Remove test script and workflow (self-cleanup)
        run: |
          git rm --quiet tools/prophetx-retest/prophetx_retest.py .github/workflows/prophetx-retest.yml || echo "rm failed"
          git commit -m "Remove ProphetX retest files (keep result)" || echo "nothing to commit"
          git push || echo "push failed"
